name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'file:./dev.db'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linting
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

  preview:
    name: Vercel Preview
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event.pull_request.draft == false
    env:
      DATABASE_URL: 'file:./dev.db'

    steps:
      - name: Check Vercel secrets
        id: check-secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "skip_deployment=true" >> $GITHUB_OUTPUT
          else
            echo "skip_deployment=false" >> $GITHUB_OUTPUT
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Checkout code
        if: steps.check-secrets.outputs.skip_deployment == 'false'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-secrets.outputs.skip_deployment == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check-secrets.outputs.skip_deployment == 'false'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.skip_deployment == 'false'
        run: npm install -g vercel

      - name: Deploy preview to Vercel
        id: vercel-deploy
        if: steps.check-secrets.outputs.skip_deployment == 'false'
        run: |
          DEPLOYMENT_URL=$(vercel --yes --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL on PR
        if: steps.check-secrets.outputs.skip_deployment == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.vercel-deploy.outputs.url }}';
            const body = `## 🚀 Preview Deployment\n\n✅ Preview is ready!\n\n🔗 **Preview URL:** ${url}\n\n> This preview was automatically deployed for PR #${context.issue.number}`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## 🚀 Preview Deployment';
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Skip deployment notice
        if: steps.check-secrets.outputs.skip_deployment == 'true'
        run: echo "🚫 Vercel preview skipped - secrets not configured"
